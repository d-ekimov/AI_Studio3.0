<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0913">
  <title>Аккаунт — AI Studio</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0913;
      --panel: rgba(24, 19, 39, .96);
      --purple: #9b72ff;
      --text: #f5f1ff;
      --muted: #a39ab8;
      --border: rgba(190, 160, 255, .2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, #39205b 0, transparent 42%),
        radial-gradient(ellipse at 90% 85%, #241448 0, transparent 38%),
        var(--bg);
    }

    button, input { font: inherit; }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--panel);
      box-shadow: 0 24px 90px #0008, 0 0 50px #8555ff12;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #a77aff, #7041db);
      box-shadow: 0 5px 24px #8955ff55;
    }

    .brand-name { font-size: 18px; font-weight: 750; }
    .brand-sub { margin-top: 4px; font-size: 12px; color: var(--muted); }

    .eyebrow {
      color: #bd9dff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 29px;
      letter-spacing: -.7px;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      margin-bottom: 22px;
      border-radius: 13px;
      background: #100d1b;
    }

    .tab {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .tab.active {
      color: white;
      background: linear-gradient(135deg, #8050df, #6038b6);
      box-shadow: 0 4px 15px #7041db35;
    }

    .field { display: block; margin-bottom: 16px; }
    .field[hidden] { display: none; }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #100d1b;
    }

    .input-wrap:focus-within {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px #9b72ff1c;
    }

    .input-wrap span { color: #9b8bb8; }
.password-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 8px 2px;
  border: 0;
  background: transparent;
  color: #b9a0f5;
  font-size: 18px;
  cursor: pointer;
}

    input {
      width: 100%;
      min-width: 0;
      padding: 14px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    input::placeholder { color: #716781; }

    .options {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 20px;
    }

    .text-button, .back {
      padding: 0;
      border: 0;
      background: transparent;
      color: #c1a6ff;
      font-size: 12px;
      cursor: pointer;
    }

    .primary, .google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      border: 0;
      color: white;
      background: linear-gradient(110deg, #9b72ff, #7445d1);
      box-shadow: 0 8px 22px #7c4bd533;
    }

    .primary:disabled {
      opacity: .65;
      cursor: wait;
    }

    .google {
      margin-top: 13px;
      border: 1px solid var(--border);
      color: white;
      background: #ffffff06;
    }

    .google-mark {
      font-size: 19px;
      font-weight: 800;
      color: #c9b2ff;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 21px 0;
      color: #817691;
      font-size: 11px;
    }

    .separator::before, .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .notice {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #b99aff20;
      border-radius: 11px;
      background: #a77aff0a;
      color: #c8bddb;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .notice.success {
      border-color: #285543;
      background: #12251e;
      color: #9ce8c2;
    }

    .notice.error {
      border-color: #713747;
      background: #29151d;
      color: #ffb7c7;
    }

    .back {
      display: block;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 13px;
    }

    button:focus-visible {
      outline: 2px solid #c5aaff;
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .card { padding: 23px 19px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">
      <div class="brand-icon">A</div>
      <div>
        <div class="brand-name">AI Studio</div>
        <div class="brand-sub">Твоя AI-платформа</div>
      </div>
    </div>

    <div class="eyebrow">ТВОЁ ПРОСТРАНСТВО</div>

    <h1 id="heading">С возвращением</h1>

    <p class="description" id="description">
      Войди, чтобы продолжить работу с любимыми AI-инструментами.
    </p>

    <div class="tabs" role="tablist" aria-label="Тип аккаунта">
      <button class="tab active" id="loginTab"
        type="button" role="tab" aria-selected="true">
        Вход
      </button>

      <button class="tab" id="registerTab"
        type="button" role="tab" aria-selected="false">
        Регистрация
      </button>
    </div>

    <form id="authForm">
      <label class="field" id="nameField" hidden>
        <span class="field-label">Имя</span>
        <span class="input-wrap">
          <span aria-hidden="true">✦</span>
          <input id="nameInput" type="text" name="name"
            placeholder="Как тебя зовут?"
            maxlength="50" autocomplete="name">
        </span>
      </label>

      <label class="field">
        <span class="field-label">Электронная почта</span>
        <span class="input-wrap">
          <span aria-hidden="true">✉</span>
          <input id="emailInput" type="email" name="email"
            placeholder="you@example.com"
            maxlength="254" autocomplete="email" required>
        </span>
      </label>

      <label class="field">
        <span class="field-label">Пароль</span>
        <span class="input-wrap">
          <span aria-hidden="true">⌑</span>
          <input id="passwordInput" type="password" name="password"
            placeholder="Введи пароль"
            minlength="8" autocomplete="current-password" required>
          <button class="password-toggle" id="togglePassword"
            type="button" aria-label="Показать пароль"
            aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg"
              width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </span>
      </label>

      <div class="options" id="forgotRow">
        <button class="text-button" type="button" id="forgotButton">
          Забыли пароль?
        </button>
      </div>

      <button class="primary" type="submit" id="submitButton">
        Войти в аккаунт <span>→</span>
      </button>
    </form>

    <div class="separator">ИЛИ ПРОДОЛЖИТЬ С</div>

    <button class="google" id="googleButton" type="button">
      <span class="google-mark">G</span>
      Продолжить с Google
    </button>

    <div class="notice" id="notice" role="status" aria-live="polite">
  Вход и регистрация защищены Supabase Auth.
  Для входа через Google используй свой аккаунт Google.
    </div>

    <button class="back" id="backButton" type="button">
      ← Вернуться в AI Studio
    </button>
  </main>

   
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://zzjfceazpjpavnyyigek.supabase.co";
const SUPABASE_KEY = "sb_publishable_uZhcc1D66aEzG5xqoe1jcg_Ts7NZI3V";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const nameField = document.getElementById("nameField");
const nameInput = document.getElementById("nameInput");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {
  const showPassword = passwordInput.type === "password";

  passwordInput.type = showPassword ? "text" : "password";

  togglePassword.innerHTML = showPassword
    ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.5 10.5 0 0 1 12 5c5 0 9 5 10 7a13 13 0 0 1-3 3.5"/><path d="M6.6 6.6C4.4 8 2.8 10.2 2 12c1 2 5 7 10 7a10 10 0 0 0 4-.8"/></svg>'
    : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';

  togglePassword.setAttribute(
    "aria-label",
    showPassword ? "Скрыть пароль" : "Показать пароль"
  );

  togglePassword.setAttribute("aria-pressed", String(showPassword));
});
const heading = document.getElementById("heading");
const description = document.getElementById("description");
const submitButton = document.getElementById("submitButton");
const forgotRow = document.getElementById("forgotRow");
const notice = document.getElementById("notice");
const authForm = document.getElementById("authForm");

let currentMode = "login";
let busy = false;

const authUrl = window.location.origin + "/AI_Studio3.0/auth.html";
const profileUrl = window.location.origin + "/AI_Studio3.0/profile.html";

async function redirectIfSignedIn() {
  try {
    const { data, error } = await supabase.auth.getSession();

    if (!error && data.session) {
      window.location.replace(profileUrl);
    }
  } catch (error) {
    console.error("Ошибка проверки сессии:", error);
  }
}

redirectIfSignedIn();
  
function showNotice(text, type = "") {
  notice.textContent = text;
  notice.className = "notice" + (type ? " " + type : "");
}

function setBusy(value) {
  busy = value;
  submitButton.disabled = value;
}

function setMode(mode) {
  currentMode = mode;
  const registering = mode === "register";

  loginTab.classList.toggle("active", !registering);
  registerTab.classList.toggle("active", registering);
  loginTab.setAttribute("aria-selected", String(!registering));
  registerTab.setAttribute("aria-selected", String(registering));

  nameField.hidden = !registering;
  nameInput.required = registering;
  passwordInput.autocomplete = registering
    ? "new-password"
    : "current-password";

  heading.textContent = registering
    ? "Создай аккаунт"
    : "С возвращением";

  description.textContent = registering
    ? "Заполни данные, чтобы продолжить."
    : "Войди, чтобы продолжить работу с любимыми AI-инструментами.";

  submitButton.innerHTML = registering
    ? 'Создать аккаунт <span>→</span>'
    : 'Войти в аккаунт <span>→</span>';

  forgotRow.hidden = registering;
  showNotice(registering
    ? "Создай аккаунт AI Studio."
    : "Войди в свой аккаунт AI Studio.");
}

loginTab.addEventListener("click", () => setMode("login"));
registerTab.addEventListener("click", () => setMode("register"));

authForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (busy) return;

  const name = nameInput.value.trim();
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (!email || !password || (currentMode === "register" && !name)) {
    showNotice("Заполни все обязательные поля.", "error");
    return;
  }

  setBusy(true);

  try {
    if (currentMode === "register") {
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name },
          emailRedirectTo: authUrl
        }
      });

      if (error) throw error;

      if (data.session) {
        window.location.replace(profileUrl);
        return;
      }

      setMode("login");
      showNotice(
        "Аккаунт создан! Проверь почту и подтверди email, затем войди.",
        "success"
      );
    } else {
      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      window.location.replace(profileUrl);
      return;
    }
  } catch (error) {
    showNotice(error.message || "Не удалось выполнить авторизацию.", "error");
  } finally {
    setBusy(false);
  }
});

document.getElementById("googleButton").addEventListener("click", async () => {
  if (busy) return;
  setBusy(true);

  try {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: authUrl }
    });

    if (error) throw error;
  } catch (error) {
    showNotice(error.message || "Не удалось войти через Google.", "error");
    setBusy(false);
  }
});

document.getElementById("forgotButton").addEventListener("click", async () => {
  const email = emailInput.value.trim().toLowerCase();

  if (!email) {
    showNotice("Сначала введи свой email.", "error");
    emailInput.focus();
    return;
  }

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: authUrl
    });

    if (error) throw error;

    showNotice("Если для этого email существует аккаунт, инструкция для сброса пароля будет отправлена на почту.", "success");
  } catch (error) {
    showNotice(error.message || "Не удалось отправить письмо.", "error");
  }
});

document.getElementById("backButton").addEventListener("click", () => {
  window.location.href = "index.html";
});

try {
  const { data, error } = await supabase.auth.getSession();
  if (error) throw error;

  if (data.session) {
    window.location.replace(profileUrl);
  } else {
    setMode("login");
  }
} catch (error) {
  showNotice("Ошибка подключения к авторизации. Проверь настройки Supabase.", "error");
}
</script>    
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0913">
  <title>Аккаунт — AI Studio</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0913;
      --panel: rgba(24, 19, 39, .96);
      --purple: #9b72ff;
      --text: #f5f1ff;
      --muted: #a39ab8;
      --border: rgba(190, 160, 255, .2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, #39205b 0, transparent 42%),
        radial-gradient(ellipse at 90% 85%, #241448 0, transparent 38%),
        var(--bg);
    }

    button, input { font: inherit; }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--panel);
      box-shadow: 0 24px 90px #0008, 0 0 50px #8555ff12;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #a77aff, #7041db);
      box-shadow: 0 5px 24px #8955ff55;
    }

    .brand-name { font-size: 18px; font-weight: 750; }
    .brand-sub { margin-top: 4px; font-size: 12px; color: var(--muted); }

    .eyebrow {
      color: #bd9dff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 29px;
      letter-spacing: -.7px;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      margin-bottom: 22px;
      border-radius: 13px;
      background: #100d1b;
    }

    .tab {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .tab.active {
      color: white;
      background: linear-gradient(135deg, #8050df, #6038b6);
      box-shadow: 0 4px 15px #7041db35;
    }

    .field { display: block; margin-bottom: 16px; }
    .field[hidden] { display: none; }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #100d1b;
    }

    .input-wrap:focus-within {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px #9b72ff1c;
    }

    .input-wrap span { color: #9b8bb8; }

    input {
      width: 100%;
      min-width: 0;
      padding: 14px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    input::placeholder { color: #716781; }

    .options {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 20px;
    }

    .text-button, .back {
      padding: 0;
      border: 0;
      background: transparent;
      color: #c1a6ff;
      font-size: 12px;
      cursor: pointer;
    }

    .primary, .google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      border: 0;
      color: white;
      background: linear-gradient(110deg, #9b72ff, #7445d1);
      box-shadow: 0 8px 22px #7c4bd533;
    }

    .primary:disabled {
      opacity: .65;
      cursor: wait;
    }

    .google {
      margin-top: 13px;
      border: 1px solid var(--border);
      color: white;
      background: #ffffff06;
    }

    .google-mark {
      font-size: 19px;
      font-weight: 800;
      color: #c9b2ff;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 21px 0;
      color: #817691;
      font-size: 11px;
    }

    .separator::before, .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .notice {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #b99aff20;
      border-radius: 11px;
      background: #a77aff0a;
      color: #c8bddb;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .notice.success {
      border-color: #285543;
      background: #12251e;
      color: #9ce8c2;
    }

    .notice.error {
      border-color: #713747;
      background: #29151d;
      color: #ffb7c7;
    }

    .back {
      display: block;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 13px;
    }

    button:focus-visible {
      outline: 2px solid #c5aaff;
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .card { padding: 23px 19px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">
      <div class="brand-icon">A</div>
      <div>
        <div class="brand-name">AI Studio</div>
        <div class="brand-sub">Твоя AI-платформа</div>
      </div>
    </div>

    <div class="eyebrow">ТВОЁ ПРОСТРАНСТВО</div>

    <h1 id="heading">С возвращением</h1>

    <p class="description" id="description">
      Войди, чтобы продолжить работу с любимыми AI-инструментами.
    </p>

    <div class="tabs" role="tablist" aria-label="Тип аккаунта">
      <button class="tab active" id="loginTab"
        type="button" role="tab" aria-selected="true">
        Вход
      </button>

      <button class="tab" id="registerTab"
        type="button" role="tab" aria-selected="false">
        Регистрация
      </button>
    </div>

    <form id="authForm">
      <label class="field" id="nameField" hidden>
        <span class="field-label">Имя</span>
        <span class="input-wrap">
          <span aria-hidden="true">✦</span>
          <input id="nameInput" type="text" name="name"
            placeholder="Как тебя зовут?"
            maxlength="50" autocomplete="name">
        </span>
      </label>

      <label class="field">
        <span class="field-label">Электронная почта</span>
        <span class="input-wrap">
          <span aria-hidden="true">✉</span>
          <input id="emailInput" type="email" name="email"
            placeholder="you@example.com"
            maxlength="254" autocomplete="email" required>
        </span>
      </label>

      <label class="field">
        <span class="field-label">Пароль</span>
        <span class="input-wrap">
          <span aria-hidden="true">⌑</span>
          <input id="passwordInput" type="password"
            name="password" placeholder="Введи пароль"
            autocomplete="current-password" required>
        </span>
      </label>

      <div class="options" id="forgotRow">
        <button class="text-button" type="button" id="forgotButton">
          Забыли пароль?
        </button>
      </div>

      <button class="primary" type="submit" id="submitButton">
        Войти в аккаунт <span>→</span>
      </button>
    </form>

    <div class="separator">ИЛИ ПРОДОЛЖИТЬ С</div>

    <button class="google" id="googleButton" type="button">
      <span class="google-mark">G</span>
      Продолжить с Google
    </button>

    <div class="notice" id="notice" role="status" aria-live="polite">
      Демонстрационный режим. Настоящая авторизация ещё не подключена.
      Не используй настоящий пароль.
    </div>

    <button class="back" id="backButton" type="button">
      ← Вернуться в AI Studio
    </button>
  </main>

  <script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("nameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const heading = document.getElementById("heading");
    const description = document.getElementById("description");
    const submitButton = document.getElementById("submitButton");
    const forgotRow = document.getElementById("forgotRow");
    const notice = document.getElementById("notice");
    const authForm = document.getElementById("authForm");

    let currentMode = "login";

    function showNotice(text, type = "") {
      notice.textContent = text;
      notice.className = "notice" + (type ? " " + type : "");
    }

    function getSavedProfile() {
      try {
        const saved = localStorage.getItem("aiStudioProfile");
        return saved ? JSON.parse(saved) : null;
      } catch (error) {
        return null;
      }
    }

    function setMode(mode) {
      currentMode = mode;
      const registering = mode === "register";

      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);

      loginTab.setAttribute("aria-selected", String(!registering));
      registerTab.setAttribute("aria-selected", String(registering));

      nameField.hidden = !registering;
      nameInput.required = registering;

      passwordInput.autocomplete = registering
        ? "new-password"
        : "current-password";

      heading.textContent = registering
        ? "Создай аккаунт"
        : "С возвращением";

      description.textContent = registering
        ? "Заполни данные, чтобы продолжить."
        : "Войди, чтобы продолжить работу с любимыми AI-инструментами.";

      submitButton.innerHTML = registering
        ? 'Создать аккаунт <span>→</span>'
        : 'Войти в аккаунт <span>→</span>';

      forgotRow.hidden = registering;

      showNotice(
        "Демонстрационный режим. Настоящая авторизация ещё не подключена. Не используй настоящий пароль."
      );
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    authForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password || (currentMode === "register" && !name)) {
        showNotice("Заполни все обязательные поля.", "error");
        return;
      }

      if (currentMode === "register") {
        const profile = {
          name: name,
          email: email
        };

        try {
          localStorage.setItem("aiStudioProfile", JSON.stringify(profile));
          showNotice("Данные сохранены. Открываем профиль…", "success");
          window.location.href = "profile.html";
        } catch (error) {
          showNotice(
            "Браузер не разрешил сохранить данные. Проверь настройки браузера.",
            "error"
          );
        }

        return;
      }

      const profile = getSavedProfile();

      if (!profile || !profile.email) {
        showNotice(
          "Демо-профиль не найден. Перейди во вкладку «Регистрация» и создай его.",
          "error"
        );
        return;
      }

      if (profile.email.toLowerCase() !== email) {
        showNotice(
          "Этот e-mail не совпадает с демо-профилем на данном устройстве.",
          "error"
        );
        return;
      }

      showNotice(
        "E-mail совпадает. В демо-режиме пароль не проверяется. Открываем профиль…",
        "success"
      );

      window.location.href = "profile.html";
    });

    document.getElementById("googleButton").addEventListener("click", () => {
      showNotice(
        "Вход через Google пока не подключён. Для него потребуется настроить сервис авторизации."
      );
    });

    document.getElementById("forgotButton").addEventListener("click", () => {
      showNotice(
        "Восстановление пароля станет доступно после подключения настоящей авторизации."
      );
    });

    document.getElementById("backButton").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    setMode("login");
  </script>
</body>
</html>
